<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada · Saúde Mental · Doutor Antônio Felipe</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --verde-escuro:#0d3330; --verde:#185d58; --areia:#faf7f2; --tinta:#17211f; --tinta-media:#45564f; --dourado:#c9a227; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; background:var(--areia); color:var(--tinta); font:1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:32rem; width:100%; text-align:center; }
  h1 { margin:0 0 .5rem; font-size:1.75rem; color:var(--verde-escuro); }
  p { margin:.5rem 0 1.5rem; color:var(--tinta-media); }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.75rem; }
  a.botao { display:flex; align-items:center; justify-content:center; min-height:3.5rem; padding:1rem 1.25rem; border-radius:1rem; text-decoration:none; font-weight:600; color:#fff; background:var(--verde-escuro); }
  a.botao--sec { color:var(--verde-escuro); background:#fff; border:1px solid rgba(69,86,79,.35); }
  a:focus-visible { outline:3px solid var(--dourado); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe ou mudou de lugar. Você pode voltar para o portal ou ver os links principais.</p>
  <ul>
    <li><a class="botao" href="/">Ir para a página inicial</a></li>
    <li><a class="botao botao--sec" href="/links">Ver os links principais</a></li>
  </ul>
</main>
</body>
</html>
